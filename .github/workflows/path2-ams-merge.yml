name: Path 2 - AMS Merge Sync

# Syncs adobe/aem-sidekick-ams (main) → adobe/aem-sidekick-ams (main-ams)
# Merges whenever main's release version changes (major, minor, or patch)
# Triggered automatically by Path 1 completing, or manually
# Weekly schedule removed -- Path 1's daily sync is the only automatic trigger now.

on:
  # schedule:
  #   - cron: '0 9 * * 1'    # Every Monday at 9am UTC -- removed, see note above
  workflow_dispatch:        # Triggered by Path 1 or manually
    inputs:
      force_sync:
        description: 'Force sync regardless of release check (for testing)'
        required: false
        default: 'false'
        type: boolean

env:
  SOURCE_BRANCH: ${{ vars.DEST_BRANCH || 'main' }}         # main (output of Path 1)
  AMS_BRANCH: ${{ vars.AMS_BRANCH || 'main-ams' }}         # main-ams (AMS customized branch)
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}                  # e.g. adobe/aem-sidekick

jobs:
  ams-merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push merged changes
      issues: write     # needed to create/close conflict, patch-drift, and templatization-candidate issues

    steps:
      - name: Checkout AMS Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ env.AMS_BRANCH }}

      # Runs every time, independent of whether main has a new release to merge --
      # patch drift can be introduced by a renovate bump landing directly on main-ams
      # (e.g. a devDependency version moves but the matching patches/*.patch filename doesn't).
      - name: Check Patch Files for Version Drift
        id: patch_drift_check
        run: |
          MISMATCHES=""
          shopt -s nullglob
          for f in patches/*.patch; do
            base=$(basename "$f" .patch)
            PKG=$(echo "$base" | sed -E 's/\+[0-9]+\.[0-9]+\.[0-9]+.*$//' | sed -E 's/^(@[^+]+)\+/\1\//')
            VER=$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^+]*$')
            INSTALLED=$(jq -r --arg p "$PKG" '(.dependencies[$p] // .devDependencies[$p] // "MISSING")' package.json | sed -E 's/^[\^~]//')
            if [ "$INSTALLED" = "MISSING" ]; then
              MISMATCHES="${MISMATCHES}"$'\n'"- \`$f\`: \`$PKG\` no longer in package.json — patch may be orphaned"
            elif [ "$INSTALLED" != "$VER" ]; then
              MISMATCHES="${MISMATCHES}"$'\n'"- \`$f\`: patch pinned to \`$VER\`, package.json now has \`$PKG@$INSTALLED\` — patch likely needs regenerating/renaming"
            fi
          done

          if [ -n "$MISMATCHES" ]; then
            echo "has_drift=true" >> $GITHUB_OUTPUT
            {
              echo 'drift_report<<PATCH_DRIFT_EOF'
              echo "$MISMATCHES"
              echo 'PATCH_DRIFT_EOF'
            } >> $GITHUB_OUTPUT
            echo "⚠️ Patch version drift detected:"
            echo "$MISMATCHES"
          else
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "✅ All patch files match their pinned package.json versions."
          fi

      - name: Check for Existing Patch Drift Issue
        id: patch_drift_issue_check
        if: steps.patch_drift_check.outputs.has_drift == 'true'
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=ams-patch-drift" \
            | jq 'length')
          echo "drift_issue_exists=$( [ "$EXISTING" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue for Patch Drift
        id: patch_drift_create_issue
        if: steps.patch_drift_check.outputs.has_drift == 'true' && steps.patch_drift_issue_check.outputs.drift_issue_exists == 'false'
        env:
          DRIFT_REPORT: ${{ steps.patch_drift_check.outputs.drift_report }}
        run: |
          BODY=$(jq -n \
            --arg report "$DRIFT_REPORT" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '"## Patch Version Drift Detected\n\nOne or more files in `patches/` no longer match the version currently pinned in `package.json`.\n\n" + $report + "\n\n**Action:** confirm whether the patch still applies cleanly at the new version (`npx patch-package <pkg>`), then rename/regenerate as needed.\n\n**Detected in run:** " + $run')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg body "$BODY" '{title: "⚠️ Patch version drift detected", body: $body, labels: ["ams-patch-drift"]}')"

      - name: Notify Slack on Patch Drift
        if: steps.patch_drift_check.outputs.has_drift == 'true' && steps.patch_drift_issue_check.outputs.drift_issue_exists == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ *Path 2 — Patch Version Drift Detected*\n*Repo:* `${{ github.repository }}`\nOne or more `patches/*.patch` files no longer match the pinned version in `package.json`. See the `ams-patch-drift` issue for details."
            }

      - name: Check for Release Update on Main
        id: version_check
        run: |
          git fetch origin

          # Get version from package.json on main branch
          LATEST=$(git show origin/${{ env.SOURCE_BRANCH }}:package.json | jq -r '.version')
          LATEST="v${LATEST}"

          # Get current version on main-ams branch (HEAD = main-ams)
          AMS_VERSION=$(cat package.json | jq -r '.version')
          AMS_VERSION="v${AMS_VERSION}"

          echo "Latest version on main:     $LATEST"
          echo "Current version on main-ams: $AMS_VERSION"

          echo "latest_tag=$LATEST" >> $GITHUB_OUTPUT
          echo "ams_tag=$AMS_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "is_minor=true" >> $GITHUB_OUTPUT
            echo "trigger_reason=Force sync" >> $GITHUB_OUTPUT
            echo "⚡ Force sync enabled — bypassing release check."
          # Weekly schedule no longer auto-bypasses the release check -- only merge
          # when main's release version has actually changed (major, minor, or patch).
          # elif [ "${{ github.event_name }}" = "schedule" ]; then
          #   echo "is_minor=true" >> $GITHUB_OUTPUT
          #   echo "trigger_reason=Weekly schedule" >> $GITHUB_OUTPUT
          #   echo "📅 Weekly scheduled sync — proceeding with AMS merge."
          elif [ "$LATEST" != "$AMS_VERSION" ]; then
            echo "is_minor=true" >> $GITHUB_OUTPUT
            echo "trigger_reason=Release updated ($AMS_VERSION → $LATEST)" >> $GITHUB_OUTPUT
            echo "✅ New release on main: main=$LATEST, main-ams=$AMS_VERSION — proceeding with AMS merge."
          else
            echo "is_minor=false" >> $GITHUB_OUTPUT
            echo "trigger_reason=No new release — skipped" >> $GITHUB_OUTPUT
            echo "⏭️ Same version ($LATEST) — skipping AMS merge."
          fi

      - name: Check for Changes to Merge
        id: changes_check
        if: steps.version_check.outputs.is_minor == 'true'
        run: |
          git fetch origin

          SOURCE_SHA=$(git rev-parse origin/${{ env.SOURCE_BRANCH }})
          AMS_SHA=$(git rev-parse HEAD)

          echo "Source (main) SHA: $SOURCE_SHA"
          echo "AMS branch SHA:    $AMS_SHA"
          echo "source_sha=$SOURCE_SHA" >> $GITHUB_OUTPUT
          echo "pre_merge_sha=$AMS_SHA" >> $GITHUB_OUTPUT

          if [ "$SOURCE_SHA" = "$AMS_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏭️ AMS branch already up to date — nothing to merge."
          else
            BEHIND=$(git rev-list HEAD..origin/${{ env.SOURCE_BRANCH }} --count)
            echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT
            if [ "$BEHIND" = "0" ]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "⏭️ AMS branch is ahead of main — nothing to merge."
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "🔄 $BEHIND new commits to merge into ${{ env.AMS_BRANCH }}."
            fi
          fi

      - name: Check for Existing Conflict Issue
        id: conflict_check
        if: steps.version_check.outputs.is_minor == 'true' && steps.changes_check.outputs.has_changes == 'true'
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=ams-sync-conflict" \
            | jq 'length')

          echo "Open conflict issues: $EXISTING"
          echo "conflict_issue_exists=$( [ "$EXISTING" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

          if [ "$EXISTING" -gt 0 ]; then
            echo "⚠️ Unresolved conflict issue exists — skipping merge until resolved."
          fi

      - name: Merge Main into AMS Branch
        id: merge_step
        if: steps.version_check.outputs.is_minor == 'true' && steps.changes_check.outputs.has_changes == 'true' && steps.conflict_check.outputs.conflict_issue_exists == 'false'
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Attempt fast-forward first (cleanest)
          if git merge --ff-only origin/${{ env.SOURCE_BRANCH }}; then
            echo "strategy=fast-forward" >> $GITHUB_OUTPUT
            echo "✅ Fast-forward merge successful."

          else
            # Fall back to merge commit — preserves existing AMS commit hashes (no rebase)
            if git merge origin/${{ env.SOURCE_BRANCH }} --no-edit \
                -m "chore(sync): merge main into ${{ env.AMS_BRANCH }}"; then
              echo "strategy=merge" >> $GITHUB_OUTPUT
              echo "✅ Merge successful."
            else
              git merge --abort
              echo "strategy=failed" >> $GITHUB_OUTPUT
              echo "❌ Merge failed — manual intervention required."
              exit 1
            fi
          fi

          # Use SOURCE_TOKEN — GITHUB_TOKEN cannot push .github/workflows/ files.
          # Unset the credential header set by checkout@v4, otherwise it overrides the remote URL token.
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin https://x-access-token:${SOURCE_TOKEN}@github.com/${{ github.repository }}.git
          git push origin ${{ env.AMS_BRANCH }}
          SYNCED_SHA=$(git rev-parse HEAD)
          echo "synced_sha=$SYNCED_SHA" >> $GITHUB_OUTPUT
          echo "✅ AMS merge complete. Now at: $SYNCED_SHA"

      # This repo has no patch-package/build.js layer at all -- templatization here is
      # docs/domain-injection.md's convention: Rollup's @rollup/plugin-replace + a custom
      # injectDomainVars() copy-transform, substituting HLX_PROD_SERVER_HOST_PAGE/_LIVE and
      # HLX_DOMAIN_PREFIX at build time. So unlike the Lambda repos, the whole surface is
      # first-party source (no node_modules layer to defer to) -- this scan is the only check.
      # Scoped to src/ only (not test/), since test fixtures are full of intentionally-literal
      # example domains (e.g. mockHelixEnvironment defaults) that aren't real candidates.
      - name: Scan Newly Merged Files for Templatization Candidates
        id: templatization_scan
        if: steps.merge_step.outcome == 'success'
        run: |
          CHANGED=$(git diff --name-only "${{ steps.changes_check.outputs.pre_merge_sha }}" "${{ steps.merge_step.outputs.synced_sha }}" -- 'src/**/*.js' 'src/**/*.mjs' || true)

          FINDINGS=""
          for f in $CHANGED; do
            [ -f "$f" ] || continue
            MATCHES=$(grep -nE "['\"\`](\.hlx\.page|\.hlx\.live|\.aem\.page|\.aem\.live|\.aem\.reviews)['\"\`]" "$f" || true)
            if [ -n "$MATCHES" ]; then
              FINDINGS="${FINDINGS}"$'\n'"**$f**"$'\n'"$MATCHES"$'\n'
            fi
          done

          if [ -n "$FINDINGS" ]; then
            echo "has_candidates=true" >> $GITHUB_OUTPUT
            {
              echo 'findings<<TEMPLATIZATION_EOF'
              echo "$FINDINGS"
              echo 'TEMPLATIZATION_EOF'
            } >> $GITHUB_OUTPUT
            echo "⚠️ Possible templatization candidates found in newly merged files:"
            echo "$FINDINGS"
          else
            echo "has_candidates=false" >> $GITHUB_OUTPUT
            echo "✅ No hardcoded domain patterns found in newly merged src/ files."
          fi

      - name: Check for Existing Templatization Candidate Issue
        id: templatization_issue_check
        if: steps.templatization_scan.outputs.has_candidates == 'true'
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=ams-templatization-candidate" \
            | jq 'length')
          echo "candidate_issue_exists=$( [ "$EXISTING" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue for Templatization Candidates
        id: templatization_create_issue
        if: steps.templatization_scan.outputs.has_candidates == 'true' && steps.templatization_issue_check.outputs.candidate_issue_exists == 'false'
        env:
          FINDINGS: ${{ steps.templatization_scan.outputs.findings }}
        run: |
          BODY=$(jq -n \
            --arg findings "$FINDINGS" \
            --arg sha "${{ steps.merge_step.outputs.synced_sha }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '"## Possible Env-Templatization Candidates\n\nThe merge from `main` brought in `src/` file changes that match a hardcoded `.hlx.*`/`.aem.*` domain pattern (see `docs/domain-injection.md` for the convention).\n\n" + $findings + "\n\n**Action:** review whether these need to become `process.env.HLX_PROD_SERVER_HOST_PAGE` / `HLX_PROD_SERVER_HOST_LIVE` / `HLX_DOMAIN_PREFIX` references instead, same as the rest of the codebase. Some hardcoded domains are intentional (e.g. `tools.aem.live`, a shared commercial-only Adobe site, not customer-specific) -- use judgment, this is notify-only.\n\n**Synced to:** `" + $sha + "`\n**Detected in run:** " + $run')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg body "$BODY" '{title: "🔍 Possible env-templatization candidates from latest sync", body: $body, labels: ["ams-templatization-candidate"]}')"

      - name: Notify Slack on Templatization Candidates
        if: steps.templatization_scan.outputs.has_candidates == 'true' && steps.templatization_issue_check.outputs.candidate_issue_exists == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔍 *Path 2 — Possible Env-Templatization Candidates*\n*Repo:* `${{ github.repository }}`\n*Synced to:* `${{ steps.merge_step.outputs.synced_sha }}`\nFiles merged from `main` contain patterns that look like hardcoded region/domain/bucket values. See the `ams-templatization-candidate` issue for details."
            }

      # Non-conflicting 3-way merges can silently drop an AMS-authored `this.X = ...`
      # instance-property assignment with no conflict marker at all, if upstream
      # restructured nearby lines in the same method (found once during the 2026-09-09
      # catch-up merge: a getCacheBuster() call site vanished with zero merge error).
      # Notify-only, same as the templatization scan above -- a disappearance here can
      # be a real drop (needs restoring) or a correct upstream removal (nothing to do),
      # only a human reading the upstream diff can tell which.
      - name: Scan for Silently Dropped this.X Assignments
        id: this_x_scan
        if: steps.merge_step.outcome == 'success'
        run: |
          PRE="${{ steps.changes_check.outputs.pre_merge_sha }}"
          POST="${{ steps.merge_step.outputs.synced_sha }}"
          CHANGED=$(git diff --name-only "$PRE" "$POST" -- 'src/**/*.js' 'src/**/*.mjs' || true)

          DROPPED=""
          for f in $CHANGED; do
            PRE_PROPS=$(git show "$PRE:$f" 2>/dev/null | grep -oE 'this\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=[^=]' | sed -E 's/this\.([A-Za-z0-9_]+).*/\1/' | sort -u || true)
            [ -z "$PRE_PROPS" ] && continue
            POST_PROPS=$(git show "$POST:$f" 2>/dev/null | grep -oE 'this\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=[^=]' | sed -E 's/this\.([A-Za-z0-9_]+).*/\1/' | sort -u || true)
            MISSING=$(comm -23 <(echo "$PRE_PROPS") <(echo "$POST_PROPS") || true)
            if [ -n "$MISSING" ]; then
              DROPPED="${DROPPED}"$'\n'"**$f**"$'\n'"$(echo "$MISSING" | sed 's/^/- this./')"$'\n'
            fi
          done

          if [ -n "$DROPPED" ]; then
            echo "has_dropped=true" >> $GITHUB_OUTPUT
            {
              echo 'dropped<<DROPPED_EOF'
              echo "$DROPPED"
              echo 'DROPPED_EOF'
            } >> $GITHUB_OUTPUT
            echo "⚠️ Possible silently-dropped this.X assignments found:"
            echo "$DROPPED"
          else
            echo "has_dropped=false" >> $GITHUB_OUTPUT
            echo "✅ No this.X assignments disappeared across the merge."
          fi

      - name: Check for Existing Dropped-Assignment Issue
        id: this_x_issue_check
        if: steps.this_x_scan.outputs.has_dropped == 'true'
        run: |
          EXISTING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=ams-dropped-assignment-candidate" \
            | jq 'length')
          echo "dropped_issue_exists=$( [ "$EXISTING" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue for Dropped Assignments
        id: this_x_create_issue
        if: steps.this_x_scan.outputs.has_dropped == 'true' && steps.this_x_issue_check.outputs.dropped_issue_exists == 'false'
        env:
          DROPPED: ${{ steps.this_x_scan.outputs.dropped }}
        run: |
          BODY=$(jq -n \
            --arg dropped "$DROPPED" \
            --arg sha "${{ steps.merge_step.outputs.synced_sha }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '"## Possible Silently-Dropped this.X Assignments\n\nThe merge from `main` changed files where a `this.X = ...` instance-property assignment present before the merge no longer appears after it, with no merge conflict raised. This can happen when git cleanly auto-merges non-overlapping edits to the same method -- it does **not** mean something is wrong, only that a human should check.\n\n" + $dropped + "\n\n**Action:** check the corresponding upstream commit(s) to see whether this property was deliberately removed/replaced (nothing to do) or silently lost in the merge (needs restoring). This is notify-only and never blocks the merge.\n\n**Synced to:** `" + $sha + "`\n**Detected in run:** " + $run')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg body "$BODY" '{title: "🔍 Possible silently-dropped this.X assignments from latest sync", body: $body, labels: ["ams-dropped-assignment-candidate"]}')"

      - name: Notify Slack on Dropped Assignments
        if: steps.this_x_scan.outputs.has_dropped == 'true' && steps.this_x_issue_check.outputs.dropped_issue_exists == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔍 *Path 2 — Possible Silently-Dropped this.X Assignments*\n*Repo:* `${{ github.repository }}`\n*Synced to:* `${{ steps.merge_step.outputs.synced_sha }}`\nA `this.X = ...` assignment present before the merge no longer appears after it, with no conflict raised. See the `ams-dropped-assignment-candidate` issue for details."
            }

      - name: Create GitHub Issue on Conflict
        id: create_issue
        if: failure() && steps.merge_step.outputs.strategy == 'failed'
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{
              \"title\": \"⚠️ AMS Sync Conflict: main → ${{ env.AMS_BRANCH }}\",
              \"body\": \"## AMS Merge Conflict Detected\n\nThe automated merge from \`${{ env.SOURCE_BRANCH }}\` into \`${{ env.AMS_BRANCH }}\` failed due to a conflict.\n\n**Action required:** Manually resolve the conflict and close this issue to re-enable automated syncing.\n\n**Steps to resolve:**\n1. \`git fetch origin\`\n2. \`git checkout ${{ env.AMS_BRANCH }}\`\n3. \`git merge origin/${{ env.SOURCE_BRANCH }}\`\n4. Resolve conflicts manually\n5. \`git push origin ${{ env.AMS_BRANCH }}\`\n6. Close this issue\n\n**Failed run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Source SHA:** \`${{ steps.changes_check.outputs.source_sha }}\`\",
              \"labels\": [\"ams-sync-conflict\"]
            }")
          ISSUE_URL=$(echo "$RESPONSE" | jq -r '.html_url')
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT

      - name: Notify Slack on Paused (conflict gate)
        if: steps.version_check.outputs.is_minor == 'true' && steps.changes_check.outputs.has_changes == 'true' && steps.conflict_check.outputs.conflict_issue_exists == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⏸️ *Path 2 Paused — Open Conflict Issue Exists*\n*Repo:* `${{ github.repository }}`\n*Version:* `${{ steps.version_check.outputs.latest_tag }}`\n*Triggered by:* ${{ steps.version_check.outputs.trigger_reason }}\nAutomated merging is paused until the open `ams-sync-conflict` issue is closed."
            }

      - name: Notify Slack on Conflict
        if: failure() && steps.merge_step.outputs.strategy == 'failed' && steps.conflict_check.outputs.conflict_issue_exists == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ *Path 2 AMS Merge Conflict!*\n*Repo:* `${{ github.repository }}`\n*Version:* `${{ steps.version_check.outputs.latest_tag }}`\nCould not merge `${{ env.SOURCE_BRANCH }}` into `${{ env.AMS_BRANCH }}`.\n\nAutomated merging is paused until the issue is closed.\n*Issue:* <${{ steps.create_issue.outputs.issue_url }}|View Conflict Issue>\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>"
            }

      - name: Close Conflict Issue on Success
        if: steps.merge_step.outcome == 'success'
        run: |
          ISSUES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=ams-sync-conflict" \
            | jq '.[].number')

          for ISSUE in $ISSUES; do
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE" \
              -d '{"state": "closed", "state_reason": "resolved"}'
            echo "✅ Closed conflict issue #$ISSUE"
          done

      - name: Notify Slack on Skipped (no new release)
        if: steps.version_check.outputs.is_minor == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⏭️ *Path 2 Skipped — No New Release*\n*Repo:* `${{ github.repository }}`\n*`main` version:* `${{ steps.version_check.outputs.latest_tag }}` (unchanged — no merge needed)\n*`${{ env.AMS_BRANCH }}` version:* `${{ steps.version_check.outputs.ams_tag }}` (current, unchanged)\n*Next sync:* when main's release version next changes, or force_sync manually"
            }

      - name: Notify Slack on No Changes
        if: steps.version_check.outputs.is_minor == 'true' && steps.changes_check.outputs.has_changes == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⏭️ *Path 2 Skipped — Already Up To Date*\n*Repo:* `${{ github.repository }}`\n*Version:* `${{ steps.version_check.outputs.latest_tag }}`\n*Triggered by:* ${{ steps.version_check.outputs.trigger_reason }}\n*Branch:* `${{ env.AMS_BRANCH }}` already up to date with `${{ env.SOURCE_BRANCH }}`"
            }

      - name: Notify Slack on Success
        if: steps.merge_step.outcome == 'success'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *Path 2 AMS Merge Complete!*\n*Repo:* `${{ github.repository }}`\n*Version:* `${{ steps.version_check.outputs.latest_tag }}`\n*Triggered by:* ${{ steps.version_check.outputs.trigger_reason }}\n*From:* `${{ env.SOURCE_BRANCH }}`\n*Into:* `${{ env.AMS_BRANCH }}`\n*Strategy:* ${{ steps.merge_step.outputs.strategy }}\n*SHA:* `${{ steps.merge_step.outputs.synced_sha }}`"
            }

      - name: Notify Slack on Failure
        if: failure() && steps.merge_step.outputs.strategy != 'failed'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ *Path 2 AMS Merge Failed!*\n*Repo:* `${{ github.repository }}`\n*Version:* `${{ steps.version_check.outputs.latest_tag }}`\n*Triggered by:* ${{ steps.version_check.outputs.trigger_reason }}\n*Merge step:* ${{ steps.merge_step.outcome }}\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>"
            }
