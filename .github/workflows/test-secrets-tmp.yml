name: TEMP - Test SOURCE_TOKEN and SLACK_WEBHOOK_URL

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Test SOURCE_TOKEN against upstream repo
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "❌ SOURCE_TOKEN is empty/not set"
            exit 1
          fi
          echo "SOURCE_TOKEN is set (length: ${#SOURCE_TOKEN})"
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/adobe/aem-sidekick")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/resp.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SOURCE_TOKEN could not read adobe/aem-sidekick"
            exit 1
          fi
          echo "✅ SOURCE_TOKEN can read adobe/aem-sidekick"

          HTTP_CODE2=$(curl -s -o /tmp/perm.json -w "%{http_code}" \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/adobe/aem-sidekick-ams")
          echo "HTTP status: $HTTP_CODE2"
          cat /tmp/perm.json
          if [ "$HTTP_CODE2" != "200" ]; then
            echo "❌ SOURCE_TOKEN could not read adobe/aem-sidekick-ams"
            exit 1
          fi
          echo "✅ SOURCE_TOKEN can read adobe/aem-sidekick-ams"

      - name: Test SLACK_WEBHOOK_URL
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🧪 *Test message — please ignore*\n*Repo:* `${{ github.repository }}`\nThis is a one-off secrets-validation test for the Path 1/Path 2 setup (workflows themselves are still disabled). Safe to disregard."
            }
